<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chút Bất Ngờ Cho Chị ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
            user-select: none;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Canvas hiệu ứng sao/hoa rơi nền tối */
        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Nút bật tắt nhạc góc phải */
        .music-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            font-size: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.3s;
        }
        .music-toggle.playing {
            animation: spin 3s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Khung chứa nội dung chính dạng kính mờ */
        .content-box {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 420px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 24px;
            padding: 35px 24px;
            text-align: center;
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.2);
        }

        /* Cặp mắt nhấp nháy dễ thương */
        .cute-eyes {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .eye {
            width: 32px;
            height: 38px;
            background: #38bdf8;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.9);
            animation: blink 3s infinite;
        }
        @keyframes blink {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }

        /* Khu vực hiển thị văn bản mượt mà */
        .text-display {
            font-size: 1.15rem;
            line-height: 1.7;
            color: #e2e8f0;
            min-height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            margin-bottom: 25px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .highlight {
            color: #f472b6;
            font-weight: 700;
        }

        /* Nút bấm tương tác */
        .action-btn {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            transition: all 0.2s ease;
            outline: none;
        }
        .action-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="music-toggle" id="musicBtn" onclick="toggleAudio()">🎵</div>
    <canvas id="bgCanvas"></canvas>

    <!-- Nhạc nền "Vì đã lỡ yêu em rồi" -->
    <audio id="bgAudio" loop src="https://files.catbox.moe/knh51p.mp3"></audio>

    <div class="content-box">
        <div class="cute-eyes">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <div class="text-display" id="textContent">
            Này chị gì ơi... Bấm vào đây để xem chút bất ngờ nhé! ✨
        </div>
        <button class="action-btn" id="mainBtn" onclick="nextStep()">Bắt đầu thui 😉</button>
    </div>

    <script>
        // Kịch bản theo đúng ý bạn
        const steps = [
            "Này chị gì ơi... Hôm nay ngày 19 chưa có gì đặc biệt...",
            "Nó chỉ là một ngày bình thường cạnh một <span class='highlight'>ngày mai rất đặc biệt!</span> ✨",
            "Em mới gặp chị á... Nhưng em thấy chị là một người dễ thương, dễ gần kkk. 😊",
            "Nói ra hơi ngại nhưng em mong hôm nay tạo được một chút bất ngờ gì đó cho chị!",
            "Tối 19 có cái gì đó vui vui thì chẳng phải <span class='highlight'>ngày 20 vui cả ngày</span> à... 🌸",
            "Em chúc chị luôn xinh đẹp, chúc chị luôn giữ được nụ cười rạng rỡ mỗi ngày! 🥰",
            "🍀 Em tặng chị cỏ 4 lá này...\nChúc chị luôn gặp thật nhiều may mắn và bình an!",
            "Chị có muốn xem tiếp nữa không nhỉ?..."
        ];

        let currentStep = -1;
        const textElem = document.getElementById('textContent');
        const btnElem = document.getElementById('mainBtn');
        const audio = document.getElementById('bgAudio');
        let musicStarted = false;

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                document.getElementById('musicBtn').classList.add('playing');
            } else {
                audio.pause();
                document.getElementById('musicBtn').classList.remove('playing');
            }
        }

        function nextStep() {
            if (!musicStarted) {
                audio.play().then(() => {
                    musicStarted = true;
                    document.getElementById('musicBtn').classList.add('playing');
                }).catch(()=>{});
            }

            currentStep++;

            if (currentStep < steps.length) {
                textElem.innerHTML = steps[currentStep];
                if (currentStep === steps.length - 1) {
                    btnElem.innerText = "Xem tiếp xem có gì nào...";
                } else {
                    btnElem.innerText = "Xem tiếp nha...";
                }
            } else {
                // Cú twist cuối cùng
                textElem.innerHTML = "<span class='highlight' style='font-size: 1.3rem;'>Ể? Hết rồi! 😜</span><br><br>... nhưng mà hết mất rồi!<br>Nếu chị muốn xem thêm thì <span class='highlight'>đợi ngày mai 20/10 nha!</span> 💖";
                btnElem.style.display = 'none';
            }
        }

        // Hiệu ứng hạt sao chuyển động trên nền tối
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        for (let i = 0; i < 50; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 3 + 1,
                speedY: Math.random() * 1 + 0.3,
                opacity: Math.random() * 0.7 + 0.2
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            particles.forEach(p => {
                ctx.globalAlpha = p.opacity;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                p.y += p.speedY;
                if (p.y > canvas.height) {
                    p.y = 0;
                    p.x = Math.random() * canvas.width;
                }
            });
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
