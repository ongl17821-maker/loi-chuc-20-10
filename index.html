<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Ngày 20/10</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #1b0033 0%, #090014 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        /* Hiệu ứng bầu trời sao */
        #starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Khung thiệp chính */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 105, 180, 0.2);
            animation: floatCard 4s ease-in-out infinite;
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 2.2rem;
            color: #ff66b2;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(255, 102, 178, 0.6);
        }

        p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #ffccff;
            margin-bottom: 25px;
        }

        .heart {
            font-size: 3rem;
            animation: pulseHeart 1.2s infinite;
            display: inline-block;
        }

        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }
    </style>
</head>
<body>

    <!-- Lớp nền sao động -->
    <div id="starfield"></div>

    <!-- Hộp nội dung thiệp -->
    <div class="card">
        <h1>Chúc Mừng 20/10 ✨</h1>
        <p>Chúc một nửa thế giới luôn rạng rỡ, xinh đẹp, luôn tràn ngập niềm vui, hạnh phúc và gặt hái thật nhiều thành công trong cuộc sống!</p>
        <div class="heart">💖</div>
    </div>

    <!-- Script tạo sao tự động gọn gàng -->
    <script>
        const starfield = document.getElementById('starfield');
        const numStars = 120; // Số lượng ngôi sao trên màn hình

        for (let i = 0; i < numStars; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            
            // Kích thước ngẫu nhiên
            const size = Math.random() * 3 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            
            // Vị trí ngẫu nhiên
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            
            // Thời gian chớp nháy ngẫu nhiên
            const duration = (Math.random() * 3 + 2).toFixed(2) + 's';
            star.style.setProperty('--duration', duration);
            star.style.animationDuration = duration;
            
            starfield.appendChild(star);
        }

        console.log("Giao diện 20/10 đã tải thành công và sạch sẽ!");
    </script>
</body>
</html>
